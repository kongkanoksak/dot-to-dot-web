<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dot-to-Dot Drawing Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="controls">
        <!-- Size Selection Controls -->
        <select id="size-select">
            <option value="A4">A4</option>
            <option value="A5" selected>A5</option>
            <option value="Letter">Letter</option>
        </select>
        <input type="number" id="width-input" placeholder="Width (in)" step="0.01">
        <input type="number" id="height-input" placeholder="Height (in)" step="0.01">
        <input type="range" id="zoom-input" min="50" max="200" value="100">
        
        <!-- Toggle Dot-to-Dot Mode -->
        <button id="dot-toggle">Enable Dot-to-Dot</button>
        
        <!-- Image Upload -->
        <button id="upload-image">Upload Image</button>
        <div id="dot-controls">
            <label for="dot-color-picker">Dot Color:</label>
            <input type="color" id="dot-color-picker" value="#0000ff">
            <select id="dot-size-select">
                <option value="normal" selected>Normal</option>
                <option value="medium">Medium</option>
                <option value="large">Large</option>
                <option value="extra-large">Extra Large</option>
            </select>
        </div>
        <div id="image-controls">
            <label for="image-lock-toggle">Lock Movement:</label>
            <input type="checkbox" id="image-lock-toggle" disabled>
        </div>

        <div id="drawing-controls">
            <button id="brush-toggle">Enable Brush</button>
            <label for="brush-color-picker">Brush Color:</label>
            <input type="color" id="brush-color-picker" value="#000000">

            <label for="brush-size">Brush Size:</label>
            <input type="range" id="brush-size" min="1" max="50" value="5">

            <label for="erase-mode-toggle">Eraser:</label>
            <input type="checkbox" id="erase-mode-toggle">
        </div>



        <!-- Save Controls -->
        <div id="save-controls">
            <div id="image-controls">
                <label for="transparency-slider">Transparency:</label>
                <input type="range" id="transparency-slider" min="0" max="100" value="100">
            </div>
            <label for="file-type">File Type:</label>
            <select id="file-type">
                <option value="png" selected>PNG</option>
                <option value="jpg">JPG</option>
                <option value="webp">WEBP</option>
            </select>
            <label>
                <input type="checkbox" id="save-only-dots">
                Save Only Dots
            </label>
            <button id="save-button">Save File</button>
        </div>
    </div>

    <!-- Canvas and Layers -->
    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>
    <div id="layer-panel">
        <button id="delete-all-layers">Delete All Layers</button>
        <h3>Layers</h3>
        <ul id="layer-list"></ul>
    </div>
    
    <!-- Scripts -->
    <script src="canvasPan.js"></script>
    <script src="script.js"></script>
    <script src="images.js"></script>
    <script src="drawing.js"></script>

</body>
</html>
